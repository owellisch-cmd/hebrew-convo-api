# Render Blueprint for PlanWise's backend.
#
# In Render: New -> Blueprint -> pick this repo. Render reads this file and
# creates the web service and the database with the settings below, so the
# only thing left to type by hand is CORS_ORIGINS (your Vercel URL).
#
# Note the free Postgres plan expires 30 days after creation. When it does,
# create a new database and repoint DATABASE_URL — see DEPLOY.md.

services:
  - type: web
    name: planwise-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: planwise-db
          property: connectionString
      # Set this to your Vercel URL after the frontend is deployed, e.g.
      # https://planwise.vercel.app  — without it the browser blocks every call.
      - key: CORS_ORIGINS
        sync: false
      # Optional. Without it the app writes its own explanations from a
      # deterministic template, which is by design.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: planwise-db
    plan: free
    databaseName: planwise
    user: planwise
